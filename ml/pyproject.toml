[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viettubelens-ml"
version = "0.1.0"
description = "Multi-task ViSoBERT training pipeline for VietTubeLens"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=0.26,<1",
  "onnxruntime>=1.20,<2",
  "pydantic>=2.13,<3",
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
  "safetensors>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "mypy>=1.14,<2"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2", "onnxscript>=0.5,<1"]
labeling = ["streamlit>=1.40,<2"]

[tool.setuptools]
py-modules = ["dataset_schema"]

[tool.setuptools.packages.find]
include = ["viettubelens_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "streamlit"
ignore_missing_imports = true

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">VietTubeLens feature constellation</title><desc id="d">Six product capabilities connected to the central Signal Prism lens.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080D1A"/><stop offset="1" stop-color="#10182B"/></linearGradient>
    <linearGradient id="p"><stop stop-color="#7C5CFC"/><stop offset=".52" stop-color="#22D3EE"/><stop offset="1" stop-color="#A3E635"/></linearGradient>

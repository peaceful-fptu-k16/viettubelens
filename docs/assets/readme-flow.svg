<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">Từ video card đến community insight</title><desc id="d">Animated VietTubeLens analysis pipeline with signals travelling between five stages.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A0F1E"/><stop offset="1" stop-color="#111A30"/></linearGradient>
    <linearGradient id="p"><stop stop-color="#7C5CFC"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#7C5CFC" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="route" d="M130 189C250 112 310 244 430 172S610 112 720 185 908 242 1070 166"/>
    <style>
      .dash{animation:dash 9s linear infinite}.ring{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.scan{animation:scan 3.8s ease-in-out infinite}.spark{animation:spark 1.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes ring{0%{opacity:.8}80%,100%{opacity:0}}@keyframes scan{0%,100%{opacity:.25}50%{opacity:1}}@keyframes spark{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.dash,.ring,.scan,.spark{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="328" rx="27" fill="none" stroke="#263350"/>
  <path d="M0 235C170 154 274 322 452 224S760 103 1200 240V330H0Z" fill="#7C5CFC" opacity=".035">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0 235C170 154 274 322 452 224S760 103 1200 240V330H0Z;M0 254C188 336 302 130 510 232S902 320 1200 202V330H0Z;M0 235C170 154 274 322 452 224S760 103 1200 240V330H0Z"/>
  </path>
  <text x="54" y="55" fill="#A78BFA" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">HOW THE SIGNAL MOVES</text>
  <text x="54" y="88" fill="#F8FAFC" font-family="Manrope,Segoe UI,sans-serif" font-size="25" font-weight="750">Một video card. Năm lớp hiểu biết.</text>
  <use href="#route" fill="none" stroke="#263550" stroke-width="3"/>
  <use href="#route" class="dash" fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 20"/>
  <g filter="url(#glow)"><circle r="6" fill="#22D3EE"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle><circle r="4" fill="#A3E635"><animateMotion dur="4.8s" begin="-2.4s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle></g>

  <g transform="translate(64 138)"><rect width="144" height="102" rx="20" fill="#121A2E" stroke="#33405F"/><rect x="14" y="14" width="56" height="40" rx="8" fill="#7C5CFC" opacity=".18"/><path d="M28 45l13-14 13 10 9-13" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/><rect x="80" y="18" width="48" height="7" rx="3.5" fill="#33405F"/><rect x="80" y="31" width="34" height="6" rx="3" fill="#27344F"/><rect x="14" y="68" width="100" height="7" rx="3.5" fill="#E2E8F0" opacity=".8"/><rect x="14" y="84" width="72" height="5" rx="2.5" fill="#64748B"/><text x="72" y="125" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="11">VIDEO CARD</text></g>
  <g transform="translate(286 128)"><circle cx="58" cy="58" r="55" fill="#121A2E" stroke="#33405F"/><circle class="ring" cx="58" cy="58" r="42" fill="none" stroke="#22D3EE" stroke-width="2"/><circle cx="58" cy="58" r="27" fill="#22D3EE" opacity=".1"/><path d="M58 38v40M38 58h40" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/><text x="58" y="136" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="11">OBSERVE</text></g>
  <g transform="translate(490 130)"><rect width="168" height="112" rx="22" fill="#121A2E" stroke="#33405F"/><g transform="translate(22 23)"><rect width="124" height="66" rx="12" fill="#0B1020"/><path d="M16 18h92M16 34h92M16 50h92" stroke="#273550"/><rect class="scan" x="16" y="12" width="16" height="48" rx="8" fill="url(#p)" opacity=".8"/><circle cx="26" cy="21" r="4" fill="#7C5CFC"/><circle cx="67" cy="37" r="4" fill="#22D3EE"/><circle cx="104" cy="53" r="4" fill="#A3E635"/></g><text x="84" y="133" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="11">ANALYZE</text></g>
  <g transform="translate(727 130)"><rect width="164" height="112" rx="22" fill="#121A2E" stroke="#33405F"/><rect x="18" y="18" width="128" height="24" rx="8" fill="#14B8A6" opacity=".12"/><circle cx="32" cy="30" r="5" fill="#14B8A6"/><rect x="44" y="26" width="84" height="7" rx="3.5" fill="#5EEAD4" opacity=".7"/><rect x="18" y="50" width="128" height="18" rx="7" fill="#7C5CFC" opacity=".1"/><rect x="18" y="76" width="94" height="18" rx="7" fill="#F9738C" opacity=".1"/><text x="82" y="133" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="11">EVIDENCE</text></g>
  <g transform="translate(960 121)"><circle cx="72" cy="62" r="60" fill="#121A2E" stroke="#33405F"/><circle cx="72" cy="62" r="42" fill="none" stroke="#263550" stroke-width="8"/><path d="M72 20a42 42 0 1 1-34 67" fill="none" stroke="url(#p)" stroke-width="8" stroke-linecap="round"/><path d="m55 62 12 11 23-25" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/><circle class="spark" cx="117" cy="26" r="5" fill="#A3E635"/><text x="72" y="143" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="11">INSIGHT</text></g>
</svg>

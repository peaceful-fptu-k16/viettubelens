<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">VietTubeLens interface states</title><desc id="d">Queued, insufficient data and ready interface states shown as animated product cards.</desc>
  <defs>
    <linearGradient id="bg" x2="1"><stop stop-color="#090E1C"/><stop offset=".5" stop-color="#10162A"/><stop offset="1" stop-color="#090E1C"/></linearGradient><linearGradient id="p"><stop stop-color="#7C5CFC"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A3E635"/></linearGradient><linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="q"><rect x="45" y="84" width="330" height="166" rx="22"/></clipPath><clipPath id="r"><rect x="825" y="84" width="330" height="166" rx="22"/></clipPath>
    <style>.rise{animation:rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-1.2s}.r3{animation-delay:-2.4s}.shimmer{animation:shimmer 2.2s linear infinite}.sweep{animation:sweep 4s ease-in-out infinite}.dot{animation:dot 1.4s ease-in-out infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}@keyframes rise{50%{transform:translateY(-6px)}}@keyframes shimmer{to{transform:translateX(400px)}}@keyframes sweep{0%,25%{transform:translateX(-380px);opacity:0}40%{opacity:.8}70%,100%{transform:translateX(380px);opacity:0}}@keyframes dot{50%{opacity:.25;transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.rise,.shimmer,.sweep,.dot{animation:none!important}}</style>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#263350"/>
  <text x="46" y="49" fill="#A78BFA" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">HONEST BY DESIGN</text><text x="236" y="49" fill="#64748B" font-family="Inter,Segoe UI,sans-serif" font-size="12">Mỗi trạng thái đều nói rõ hệ thống đang biết gì.</text>
  <g class="rise">
    <rect x="45" y="84" width="330" height="166" rx="22" fill="#121A2E" stroke="#33415F"/><g clip-path="url(#q)"><rect class="shimmer" x="-220" y="84" width="120" height="166" fill="url(#shine)" transform="skewX(-16)"/></g>
    <circle cx="78" cy="118" r="16" fill="#7C5CFC" opacity=".18"/><circle class="dot" cx="72" cy="118" r="3" fill="#A78BFA"/><circle class="dot d2" cx="78" cy="118" r="3" fill="#A78BFA"/><circle class="dot d3" cx="84" cy="118" r="3" fill="#A78BFA"/><text x="105" y="115" fill="#F8FAFC" font-family="Manrope,Segoe UI,sans-serif" font-size="16" font-weight="700">Đang đọc tín hiệu</text><text x="105" y="134" fill="#64748B" font-family="Inter,Segoe UI,sans-serif" font-size="10">queued · không khóa giao diện</text>
    <rect x="68" y="161" width="274" height="12" rx="6" fill="#26324B"/><rect x="68" y="184" width="218" height="9" rx="4.5" fill="#202A41"/><rect x="68" y="204" width="248" height="9" rx="4.5" fill="#202A41"/><text x="68" y="232" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="10">Bạn vẫn có thể tiếp tục cuộn YouTube</text>
  </g>
  <g class="rise r2">
    <rect x="435" y="84" width="330" height="166" rx="22" fill="#121A2E" stroke="#33415F"/><circle cx="468" cy="118" r="16" fill="#F59E0B" opacity=".13"/><path d="M468 107v14M468 128v1" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/><text x="495" y="115" fill="#F8FAFC" font-family="Manrope,Segoe UI,sans-serif" font-size="16" font-weight="700">Chưa đủ dữ liệu</text><text x="495" y="134" fill="#64748B" font-family="Inter,Segoe UI,sans-serif" font-size="10">insufficient_data · chủ động từ chối</text>
    <rect x="458" y="159" width="284" height="54" rx="13" fill="#F59E0B" opacity=".07" stroke="#F59E0B" stroke-opacity=".28"/><text x="476" y="180" fill="#FDE68A" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">Vì sao?</text><text x="476" y="198" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="10">Chỉ có 7/30 bình luận phù hợp · cần ít nhất 10</text><text x="458" y="232" fill="#64748B" font-family="Inter,Segoe UI,sans-serif" font-size="10">Không biến sự không chắc chắn thành kết luận.</text>
  </g>
  <g class="rise r3">
    <rect x="825" y="84" width="330" height="166" rx="22" fill="#121A2E" stroke="#33415F"/><g clip-path="url(#r)"><rect class="sweep" x="700" y="84" width="130" height="166" fill="url(#p)" opacity="0"/></g>
    <circle cx="866" cy="132" r="28" fill="#0B1020" stroke="#27344F" stroke-width="6"/><path d="M866 104a28 28 0 1 1-22 45" fill="none" stroke="url(#p)" stroke-width="6" stroke-linecap="round"/><text x="866" y="136" text-anchor="middle" fill="#F8FAFC" font-family="Manrope,Segoe UI,sans-serif" font-size="17" font-weight="800">79</text><rect x="912" y="105" width="70" height="20" rx="10" fill="#14B8A6" opacity=".13"/><text x="947" y="119" text-anchor="middle" fill="#5EEAD4" font-family="Inter,Segoe UI,sans-serif" font-size="9" font-weight="700">TÍCH CỰC</text><text x="912" y="149" fill="#F8FAFC" font-family="Manrope,Segoe UI,sans-serif" font-size="17" font-weight="700">Sẵn sàng kiểm chứng</text><text x="912" y="168" fill="#64748B" font-family="Inter,Segoe UI,sans-serif" font-size="10">ready · 24/30 phù hợp</text>
    <rect x="850" y="194" width="280" height="8" rx="4" fill="#26324B"/><rect x="850" y="194" width="160" height="8" rx="4" fill="#14B8A6"/><rect x="1014" y="194" width="64" height="8" fill="#64748B"/><rect x="1082" y="194" width="48" height="8" rx="4" fill="#F9738C"/><text x="850" y="226" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="10">Evidence · confidence · nguồn dữ liệu</text>
  </g>
</svg>
